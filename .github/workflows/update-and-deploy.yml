name: Update ETF data and deploy Pages

on:
  schedule:
    - cron: "0 12 * * 6"
      timezone: "Asia/Taipei"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install --requirement requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Download prices and rebuild dashboard data
        run: python scripts/update_dashboard.py

      - name: Validate generated data
        run: python scripts/validate_dashboard.py

      - name: Save verified data in GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/etf_price_history.csv.gz data/etf_meta_dashboard.json assets/etf-meta-dashboard-data.js
          git diff --cached --quiet || git commit -m "chore: update ETF dashboard data [skip ci]"
          git push

      - name: Prepare static site
        run: |
          mkdir -p _site/assets _site/data
          cp index.html _site/index.html
          cp assets/etf-meta-dashboard-data.js _site/assets/etf-meta-dashboard-data.js
          cp data/etf_meta_dashboard.json _site/data/etf_meta_dashboard.json
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
